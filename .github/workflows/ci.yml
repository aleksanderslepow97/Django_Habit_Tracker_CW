
name: Django CI/CD Pipeline

on: [push, ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Flake8
        run: flake8 .

  test:
    needs: [lint]
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}

    steps:
    - name: Check out code
      uses: actions/checkout@v3

    - name: Create .env file
      run: echo "${{ secrets.ENV_FILE_CONTENT }}" > .env

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

#    - name: Debug Environment Variables
#      run: env

    - name: Set environment variables
      run: | 
        echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> $GITHUB_aleksanderslepow97
        echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> $GITHUB_aleksanderslepow97
        echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> $GITHUB_aleksanderslepow97ENV
        echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> $GITHUB_aleksanderslepow97
        

    - name: Run migrate
      run: python manage.py migrate

    - name: Run tests
      run: python manage.py test

  build:
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: echo ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/habits:${{ github.aleksanderslepow97 }} .

      - name: Push Docker image to Docker Hub
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/habits:${{ github.aleksanderslepow97 }}

  deploy:
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Deploy to Server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/habits:${{ github.aleksanderslepow97 }}
          docker stop habits || true
          docker rm habits || true
          echo "${{ secrets.ENV_FILE_CONTENT }}" > .env
          docker run -d --name habits -p 80:8000 ${{ secrets.DOCKER_HUB_USERNAME }}/habits:${{ github.aleksanderslepow97 }} 
          EOF

      
