services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: ${NAME_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - habit_tracker_network

  redis:
    image: redis:latest
    networks:
      - habit_tracker_network

  celery:
    build: .
    command: poetry run celery -A config worker -l INFO --concurrency=500 --pool=gevent
    volumes:
      - .:/habit_tracker
    depends_on:
      - postgres
      - redis
    networks:
      - habit_tracker_network

  celery-beat:
    build: .
    command: poetry run celery -A config beat --loglevel=info
    volumes:
      - .:/habit_tracker
    depends_on:
      - postgres
      - redis
    networks:
      - habit_tracker_network

  habit_tracker:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "poetry run python manage.py collectstatic --noinput && poetry run gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/habit_tracker
      - static_volume:/habit_tracker/staticfiles
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${NAME_DB}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}

    depends_on:
      - postgres
      - redis
    networks:
      - habit_tracker_network

  nginx:
    build:
      context: ./nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/nginx/staticfiles
    depends_on:
      - habit_tracker
    networks:
      - habit_tracker_network

networks:
  habit_tracker_network:

volumes:
  postgres_data:
  static_volume:
